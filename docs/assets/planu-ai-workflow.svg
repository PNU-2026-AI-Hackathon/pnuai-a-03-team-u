<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">Plan-U AI 추천 흐름</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><style><![CDATA[text{font-family:Inter,Pretendard,'Apple SD Gothic Neo',Arial,sans-serif}.h{fill:#101828;font-weight:800}.b{fill:#667085}.l{stroke:#b7c4d6;stroke-width:2.5;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1200" height="680" rx="30" fill="#fff"/><rect x="1" y="1" width="1198" height="678" rx="29" fill="none" stroke="#e8edf4" stroke-width="2"/><text x="64" y="84" class="h" font-size="34">AI 추천도, 근거부터 확인합니다</text><text x="64" y="118" class="b" font-size="18">자유로운 답변이 아니라 실제 학사 데이터와 도구 호출을 거친 뒤에만 제안합니다.</text>
<text x="64" y="210" fill="#2f6df6" font-size="68" font-family="Inter" font-weight="800">01</text><text x="64" y="250" class="h" font-size="24">학생 맥락</text><text x="64" y="284" class="b" font-size="16">이수내역 · 진로 · 시간 제약</text><path class="l" d="M260 235h95"/>
<text x="376" y="210" fill="#2f6df6" font-size="68" font-family="Inter" font-weight="800">02</text><text x="376" y="250" class="h" font-size="24">규칙 기반 판정</text><text x="376" y="284" class="b" font-size="16">남은 요건 · 선수과목 · 충돌 확정</text><path class="l" d="M640 235h82"/>
<rect x="746" y="160" width="390" height="150" rx="20" fill="#f3f7ff"/><text x="778" y="210" class="h" font-size="24">03  도구 기반 AI 제안</text><text x="778" y="246" class="b" font-size="16">강좌 검색 · RAG 근거 · 시간표 조합</text><text x="778" y="278" fill="#2f6df6" font-size="16" font-family="Inter" font-weight="700">로드맵과 시간표는 독립적으로 제안</text>
<path class="l" d="M940 310v86"/><rect x="192" y="420" width="816" height="126" rx="22" fill="#fff" stroke="#d5f0e9" stroke-width="2"/><text x="230" y="470" class="h" font-size="26">04  학생이 최종 승인</text><text x="230" y="506" class="b" font-size="18">체크한 로드맵 항목과 분반만 실제 데이터에 반영 · 언제든 다시 조정 가능</text><text x="64" y="624" class="b" font-size="15">검증 가능한 추천  ·  졸업요건 판정은 LLM이 아닌 규칙 엔진이 담당하고, AI는 설명과 선택지를 제공합니다.</text></svg>
