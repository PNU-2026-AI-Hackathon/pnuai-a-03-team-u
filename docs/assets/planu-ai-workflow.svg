<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t"><title id="t">PlanU AI 기능 설명</title><defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1674FA"/><stop offset="1" stop-color="#62D7ED"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#173f78" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#153D79"/></marker><style><![CDATA[text{font-family:Inter,Pretendard,'Apple SD Gothic Neo',Arial,sans-serif}.h{fill:#07172F;font-weight:800}.b{fill:#374B66}.u{fill:#176FF8;font-weight:800}.o{fill:#F47E10;font-weight:800}.l{fill:none;stroke:#153D79;stroke-width:3;marker-end:url(#a)}]]></style></defs><rect width="1600" height="900" fill="#fff"/><path d="M0 0h340c70 85 168 116 286 94M1600 0v240c-124 47-181-17-274 21-90 37-90 117-215 119" fill="none" stroke="#EAF3FF" stroke-width="48"/>
<g transform="translate(54 42)"><rect width="72" height="72" rx="22" fill="url(#g)"/><circle cx="25" cy="28" r="6" fill="#fff"/><circle cx="47" cy="28" r="6" fill="#fff"/><path d="M20 45c6 14 25 14 31 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="92" y="54" class="h" font-size="49">Plan<tspan fill="url(#g)">U</tspan> AI 기능 설명</text></g><text x="54" y="151" class="u" font-size="22">AI는 정해진 도구로 실제 데이터를 확인해 제안하고, 사용자가 승인한 항목만 반영합니다.</text>
<path class="l" d="M800 298v58"/><path class="l" d="M800 535v36H456v28"/><path class="l" d="M800 535v36h340v28"/>
<g filter="url(#s)"><rect x="522" y="210" width="556" height="89" rx="20" fill="#FFF9EA" stroke="#FFC45A" stroke-width="2"/><circle cx="560" cy="255" r="19" fill="#FFA510"/><text x="554" y="263" fill="#fff" font-size="21" font-weight="800">1</text><text x="598" y="264" class="o" font-size="25">학생의 학사 정보 + 규칙 기반 졸업요건 분석</text><text x="598" y="289" class="b" font-size="15">이 단계는 LLM이 판정하지 않습니다. 정확한 부족 요건을 먼저 확정합니다.</text></g>
<g filter="url(#s)"><rect x="70" y="598" width="720" height="195" rx="23" fill="#F3F8FF" stroke="#82B6FF" stroke-width="2"/><circle cx="109" cy="638" r="19" fill="#2675F7"/><text x="103" y="646" fill="#fff" font-size="21" font-weight="800">2</text><text x="148" y="646" class="u" font-size="27">AI 성장 로드맵</text><image x="465" y="618" width="100" height="27" xlink:href="data:image/svg+xml;base64,"/><image x="582" y="615" width="31" height="31" xlink:href="data:image/svg+xml;base64,"/><text x="628" y="642" class="h" font-size="18">LangChain</text><rect x="108" y="674" width="190" height="67" rx="10" fill="#fff" stroke="#CDE0FF"/><text x="126" y="702" class="u" font-size="15">1. 남은 학기·요건 조회</text><text x="126" y="727" class="b" font-size="14">get_roadmap_items</text><rect x="315" y="674" width="190" height="67" rx="10" fill="#fff" stroke="#CDE0FF"/><text x="333" y="702" class="u" font-size="15">2. 실제 강좌 검색</text><text x="333" y="727" class="b" font-size="14">search_courses</text><rect x="522" y="674" width="230" height="67" rx="10" fill="#fff" stroke="#CDE0FF"/><text x="540" y="702" class="u" font-size="15">3. 학기별 변경안 제안</text><text x="540" y="727" class="b" font-size="14">propose_change / term_plan</text><text x="108" y="772" class="b" font-size="15">로드맵은 장기 학업 계획에 대한 독립적인 AI 상담 기능입니다.</text></g>
<g filter="url(#s)"><rect x="810" y="598" width="720" height="195" rx="23" fill="#F3F8FF" stroke="#82B6FF" stroke-width="2"/><circle cx="849" cy="638" r="19" fill="#2675F7"/><text x="843" y="646" fill="#fff" font-size="21" font-weight="800">2</text><text x="888" y="646" class="u" font-size="27">AI 다음 학기 시간표</text><image x="1211" y="618" width="100" height="27" xlink:href="data:image/svg+xml;base64,"/><image x="1328" y="615" width="31" height="31" xlink:href="data:image/svg+xml;base64,"/><text x="1373" y="642" class="h" font-size="18">규칙 엔진</text><rect x="848" y="674" width="190" height="67" rx="10" fill="#fff" stroke="#CDE0FF"/><text x="866" y="702" class="u" font-size="15">1. 조건·남은 요건 조회</text><text x="866" y="727" class="b" font-size="14">get_student_context</text><rect x="1055" y="674" width="190" height="67" rx="10" fill="#fff" stroke="#CDE0FF"/><text x="1073" y="702" class="u" font-size="15">2. 개설 강좌 검색</text><text x="1073" y="727" class="b" font-size="14">list_offered_courses</text><rect x="1262" y="674" width="230" height="67" rx="10" fill="#fff" stroke="#CDE0FF"/><text x="1280" y="702" class="u" font-size="15">3. 충돌 없는 조합 생성</text><text x="1280" y="727" class="b" font-size="14">build_timetable</text><text x="848" y="772" class="b" font-size="15">시간표는 로드맵 없이도 완결되는 독립적인 추천 기능입니다.</text></g>
<g filter="url(#s)"><rect x="414" y="830" width="772" height="48" rx="17" fill="#fff" stroke="#E0EBFA"/><text x="460" y="861" class="u" font-size="18">Human-in-the-loop</text><text x="697" y="861" class="b" font-size="17">AI는 제안만 하고, 사용자가 체크해 승인한 선택만 실제 데이터에 반영합니다.</text></g></svg>
