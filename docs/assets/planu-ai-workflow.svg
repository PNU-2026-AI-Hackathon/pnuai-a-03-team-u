<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title"><title id="title">Plan-U AI 에이전트 도구 호출 흐름</title><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#64748b"/></marker><style><![CDATA[text{font-family:Inter,Pretendard,'Apple SD Gothic Neo',Arial,sans-serif}.h{font-weight:800;fill:#0f172a}.s{fill:#64748b}.n{fill:#fff;stroke-width:2.5;rx:18}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1600" height="800" fill="#f8fafc"/><text x="72" y="75" class="h" font-size="36">AI 에이전트의 검증 가능한 추천 흐름</text><text x="72" y="108" class="s" font-size="18">AI는 도구로 실제 데이터를 확인한 뒤 제안하며, 제안은 사용자가 승인해야만 저장됩니다.</text>
<rect x="76" y="310" width="220" height="150" class="n" stroke="#38bdf8"/><text x="108" y="365" class="h" font-size="24">① 학사정보</text><text x="108" y="405" class="s" font-size="17">이수현황 · 전공 · 제약</text>
<rect x="390" y="310" width="230" height="150" class="n" stroke="#f59e0b"/><text x="422" y="365" class="h" font-size="24">② 규칙 기반 판정</text><text x="422" y="405" class="s" font-size="17">남은 요건·선수과목 확정</text>
<rect x="714" y="105" width="360" height="190" class="n" stroke="#2563eb"/><text x="746" y="158" class="h" font-size="24">③ 성장 로드맵 에이전트</text><text x="746" y="198" class="s" font-size="16">get_roadmap_items · get_graduation_progress</text><text x="746" y="228" class="s" font-size="16">search_courses → 학기별 변경안 제안</text>
<rect x="714" y="505" width="360" height="190" class="n" stroke="#14b8a6"/><text x="746" y="558" class="h" font-size="24">③ 시간표 추천 에이전트</text><text x="746" y="598" class="s" font-size="16">get_student_context · list_offered_courses</text><text x="746" y="628" class="s" font-size="16">build_timetable → 충돌 없는 후보 제안</text>
<rect x="1170" y="310" width="330" height="150" class="n" stroke="#10b981"/><text x="1202" y="365" class="h" font-size="24">④ 사용자 승인</text><text x="1202" y="405" class="s" font-size="17">선택한 제안만 로드맵·시간표에 저장</text>
<path class="a" d="M296 385H390"/><path class="a" d="M620 355H670V200H714"/><path class="a" d="M620 415H670V600H714"/><path class="a" d="M1074 200H1120V350H1170"/><path class="a" d="M1074 600H1120V420H1170"/><rect x="384" y="545" width="240" height="76" rx="14" fill="#eef2ff"/><text x="410" y="578" class="h" font-size="17">RAG 검색</text><text x="410" y="606" class="s" font-size="15">교육과정·강의계획서 근거</text><path class="a" d="M624 582H714"/></svg>
