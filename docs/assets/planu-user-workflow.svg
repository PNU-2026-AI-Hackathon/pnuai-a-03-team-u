<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title"><title id="title">Plan-U 사용자 전체 흐름</title><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#64748b"/></marker><style><![CDATA[text{font-family:Inter,Pretendard,'Apple SD Gothic Neo',Arial,sans-serif}.h{font-weight:800;fill:#0f172a}.s{fill:#64748b}.n{fill:#fff;stroke-width:2.5;rx:22}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1600" height="720" fill="#f8fafc"/><text x="72" y="78" class="h" font-size="36">Plan-U 사용자 흐름</text><text x="72" y="112" class="s" font-size="18">온보딩 이후에는 졸업요건 분석·성장 로드맵·시간표 작성을 원하는 순서로 이용할 수 있습니다.</text>
<rect x="78" y="260" width="250" height="180" class="n" stroke="#38bdf8"/><text x="110" y="315" class="h" font-size="24">① 회원가입</text><text x="110" y="355" class="s" font-size="17">부산대 웹메일 인증</text><text x="110" y="383" class="s" font-size="17">학과·전공 선택</text>
<rect x="432" y="260" width="250" height="180" class="n" stroke="#fbbf24"/><text x="464" y="315" class="h" font-size="24">② 학사정보 동기화</text><text x="464" y="355" class="s" font-size="17">이수내역 · 학적 · 지도교수</text><text x="464" y="383" class="s" font-size="17">필요 시 나중에 진행 가능</text>
<rect x="786" y="120" width="300" height="150" class="n" stroke="#f59e0b"/><text x="818" y="174" class="h" font-size="24">졸업요건 분석</text><text x="818" y="213" class="s" font-size="17">주전공·다전공 충족 여부</text>
<rect x="786" y="350" width="300" height="150" class="n" stroke="#2563eb"/><text x="818" y="404" class="h" font-size="24">③ 성장 로드맵</text><text x="818" y="443" class="s" font-size="17">학기별 계획 · AI 상담 제안</text>
<rect x="786" y="580" width="300" height="100" class="n" stroke="#14b8a6"/><text x="818" y="630" class="h" font-size="24">③ 다음 학기 시간표</text><text x="818" y="660" class="s" font-size="16">개설 강좌 · 충돌 없는 후보</text>
<rect x="1230" y="322" width="270" height="170" class="n" stroke="#10b981"/><text x="1262" y="377" class="h" font-size="25">④ 사용자 승인</text><text x="1262" y="417" class="s" font-size="17">체크한 계획·분반만</text><text x="1262" y="445" class="s" font-size="17">실제 데이터에 반영</text>
