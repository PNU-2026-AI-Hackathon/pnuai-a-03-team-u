<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t"><title id="t">Plan-U 사용자 흐름</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><style><![CDATA[text{font-family:Inter,Pretendard,'Apple SD Gothic Neo',Arial,sans-serif}.h{fill:#101828;font-weight:800}.b{fill:#667085}.line{stroke:#b7c4d6;stroke-width:2.5;fill:none;marker-end:url(#a)}]]></style></defs><rect width="1200" height="660" rx="30" fill="#fff"/><rect x="1" y="1" width="1198" height="658" rx="29" fill="none" stroke="#e8edf4" stroke-width="2"/><text x="64" y="84" class="h" font-size="34">수강 계획, 한 흐름으로</text><text x="64" y="118" class="b" font-size="18">모든 제안은 학생이 확인하고 승인할 때만 실제 계획이 됩니다.</text>
<text x="64" y="210" fill="#2f6df6" font-size="70" font-family="Inter" font-weight="800">01</text><text x="64" y="252" class="h" font-size="25">회원가입</text><text x="64" y="286" class="b" font-size="16">웹메일 인증 · 학과·전공 선택</text><path class="line" d="M262 236h90"/>
<text x="370" y="210" fill="#2f6df6" font-size="70" font-family="Inter" font-weight="800">02</text><text x="370" y="252" class="h" font-size="25">학사정보 동기화</text><text x="370" y="286" class="b" font-size="16">이수내역 · 학적 · 지도교수</text><path class="line" d="M594 236h90"/>
<rect x="704" y="164" width="416" height="158" rx="20" fill="#f3f7ff"/><text x="736" y="214" class="h" font-size="25">03  졸업요건 분석</text><text x="736" y="250" class="b" font-size="17">규칙 엔진이 현재 부족한 요건을 정확히 계산</text><text x="736" y="284" fill="#2f6df6" font-size="16" font-family="Inter" font-weight="700">AI가 판정하지 않습니다</text>
<path class="line" d="M912 322v42H310v30"/><path class="line" d="M912 322v72"/><text x="530" y="356" class="b" font-size="15">같은 졸업요건 분석 결과를 참고하지만, 서로 독립적으로 이용</text>
<rect x="64" y="414" width="494" height="156" rx="22" fill="#fff" stroke="#dce7f8" stroke-width="2"/><text x="96" y="450" fill="#2f6df6" font-size="15" font-family="Inter" font-weight="800">INDEPENDENT FEATURE A</text><text x="96" y="486" class="h" font-size="25">04  AI 성장 로드맵</text><text x="96" y="520" class="b" font-size="17">남은 학기를 살펴보고, AI가 과목 계획을 제안</text><text x="96" y="548" fill="#2f6df6" font-size="15" font-family="Inter" font-weight="700">시간표를 만들지 않아도 단독으로 완결</text>
<rect x="642" y="414" width="494" height="156" rx="22" fill="#fff" stroke="#d5f0e9" stroke-width="2"/><text x="674" y="450" fill="#0e9f8a" font-size="15" font-family="Inter" font-weight="800">INDEPENDENT FEATURE B</text><text x="674" y="486" class="h" font-size="25">04  AI 다음 학기 시간표</text><text x="674" y="520" class="b" font-size="17">실제 개설 강좌에서 충돌 없는 후보를 제안</text><text x="674" y="548" fill="#0e9f8a" font-size="15" font-family="Inter" font-weight="700">로드맵 없이도 단독으로 완결</text>
<text x="64" y="625" class="b" font-size="15">선택 연결  ·  확정한 시간표 분반은 필요할 때만 로드맵에 반영할 수 있습니다.</text></svg>
